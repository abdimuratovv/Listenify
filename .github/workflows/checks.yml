name: Listenify checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: listenify
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: listenify
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://listenify:ci-only-password@localhost:5432/listenify
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check backend manage.py && ruff format --check backend manage.py
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test backend.core.tests.test_domain backend.core.tests.test_concurrency
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py test backend.core.tests.test_browser
